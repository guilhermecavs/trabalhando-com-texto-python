<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5b6472"/>
    </marker>
  </defs>
  <!-- entrada: texto -->
  <rect x="14" y="96" width="104" height="58" rx="12" fill="#ffffff" stroke="#00b4d8" stroke-width="2"/>
  <text x="66" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#161a22">texto</text>
  <text x="66" y="139" text-anchor="middle" font-size="11" fill="#5b6472">(string)</text>
  <line x1="120" y1="125" x2="152" y2="125" stroke="#5b6472" stroke-width="2" marker-end="url(#arw)"/>

  <!-- container do pipeline: nlp (Language) -->
  <rect x="158" y="40" width="512" height="170" rx="16" fill="#efe9ff" stroke="#6c4cf1" stroke-width="2"/>
  <text x="176" y="66" font-size="13" font-weight="700" fill="#6c4cf1">nlp — objeto Language (pipeline)</text>

  <!-- componente separado: tokenizer -->
  <rect x="176" y="92" width="96" height="90" rx="10" fill="#ffffff" stroke="#6c4cf1" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="224" y="126" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2b3242">tokenizer</text>
  <text x="224" y="146" text-anchor="middle" font-size="10" fill="#5b6472">quebra em</text>
  <text x="224" y="159" text-anchor="middle" font-size="10" fill="#5b6472">tokens</text>

  <!-- componentes do pipeline -->
  <g>
    <rect x="288" y="92" width="84" height="90" rx="10" fill="#ffffff" stroke="#00b4d8" stroke-width="1.6"/>
    <text x="330" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#2b3242">tagger</text>
    <text x="330" y="150" text-anchor="middle" font-size="10" fill="#5b6472">pos_ / tag_</text>

    <rect x="384" y="92" width="84" height="90" rx="10" fill="#ffffff" stroke="#00b4d8" stroke-width="1.6"/>
    <text x="426" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#2b3242">parser</text>
    <text x="426" y="150" text-anchor="middle" font-size="10" fill="#5b6472">dep_</text>

    <rect x="480" y="92" width="84" height="90" rx="10" fill="#ffffff" stroke="#00b4d8" stroke-width="1.6"/>
    <text x="522" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#2b3242">lemma-</text>
    <text x="522" y="141" text-anchor="middle" font-size="12" font-weight="700" fill="#2b3242">tizer</text>
    <text x="522" y="159" text-anchor="middle" font-size="10" fill="#5b6472">lemma_</text>

    <rect x="576" y="92" width="80" height="90" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.6"/>
    <text x="616" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#2b3242">ner</text>
    <text x="616" y="150" text-anchor="middle" font-size="10" fill="#5b6472">.ents</text>
  </g>
  <!-- setas entre componentes -->
  <line x1="272" y1="137" x2="286" y2="137" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="372" y1="137" x2="382" y2="137" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="468" y1="137" x2="478" y2="137" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="564" y1="137" x2="574" y2="137" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- saida: Doc -->
  <line x1="672" y1="125" x2="704" y2="125" stroke="#5b6472" stroke-width="2" marker-end="url(#arw)"/>
  <rect x="710" y="82" width="136" height="86" rx="12" fill="#ffffff" stroke="#6c4cf1" stroke-width="2"/>
  <text x="778" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#161a22">Doc</text>
  <text x="778" y="132" text-anchor="middle" font-size="10" fill="#5b6472">sequência de Tokens</text>
  <text x="778" y="147" text-anchor="middle" font-size="10" fill="#5b6472">já anotados</text>

  <text x="430" y="234" text-anchor="middle" font-size="11" fill="#5b6472">Chamar <tspan font-family="monospace" fill="#5a34d6">nlp(texto)</tspan> passa o texto por todos os componentes e devolve um Doc anotado.</text>
</svg>
